sim:b0_tracking:
  extends: .det_benchmark
  stage: simulate
  parallel:
    matrix:
      - P: 15
      - P: 41
  script:
    - snakemake $SNAKEMAKE_FLAGS --cores $MAX_CORES_PER_JOB sim_output/b0_tracking/epic_craterlake/protons_${P}GeV.edm4eic.root
  retry:
    max: 2
    when:
      - runner_system_failure

bench:b0_tracking:
  extends: .det_benchmark
  stage: benchmarks
  needs: ["sim:b0_tracking"]
  script:
    - snakemake $SNAKEMAKE_FLAGS --cores 1 results/epic_craterlake/b0_tracking

collect_results:b0_tracking:
  extends: .det_benchmark
  stage: collect
  needs: ["bench:b0_tracking"]
  when: always
  script:
    - ls -al
    - mv results{,_save}/ # move results directory out of the way to preserve it
    - snakemake $SNAKEMAKE_FLAGS --cores 1 --delete-all-output results/epic_craterlake/b0_tracking
    - mv results{_save,}/
